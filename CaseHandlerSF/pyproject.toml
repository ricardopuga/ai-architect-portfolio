[project]
name = "casehandlersf"
version = "0.1.0"
description = "Summarize Salesforce case exports and serve Cases from Salesforce over HTTP"
readme = "README.md"
authors = [
    { name = "Ricardo Puga", email = "48763402+ricardopuga@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.4.0",
    "boto3[crt]>=1.43.64",
    "fastapi[standard]>=0.143.0",
    "fastembed>=0.9.1",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.15.0",
    "simple-salesforce>=1.12.10",
]

[project.scripts]
casehandlersf = "casehandlersf:main"
casehandlersf-mcp = "casehandlersf.mcp_server:main"
casehandlersf-agent = "casehandlersf.agent:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
